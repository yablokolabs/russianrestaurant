<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russian Restaurant — Coming Soon, Bengaluru</title>
  <meta name="description" content="An authentic Russian restaurant coming soon to Bengaluru, India. Скорo открытие. Follow us for the grand opening.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="leaves" aria-hidden="true"></canvas>

  <main class="content">
    <div class="stage">
      <section class="card">
        <header class="brand">
          <div class="logo-mark">
            <svg viewBox="0 0 64 64" fill="none">
              <path d="M32 6c9 6 15 18 13 31-1 10-7 18-13 20-6-2-12-10-13-20-2-13 4-25 13-31z" fill="#f8b203"/>
              <path d="M32 6c-4 12-4 26 0 51" stroke="#b58a3c" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M32 20c6 2 10 6 11 12" stroke="#b58a3c" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M32 34c-5 3-8 7-8 13" stroke="#b58a3c" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="brand-name-ru">РУССКИЙ РЕСТОРАН</p>
          <p class="brand-name">Russian Restaurant</p>
          <p class="brand-tagline">Русская кухня · Russian Kitchen</p>
        </header>

        <p class="eyebrow">Скоро открытие</p>
        <h1 class="title">Coming Soon</h1>
        <p class="subtitle">Vegetarian Russian Cuisine — India's First<br><span class="subtitle-line">Where Russian soul meets Indian soil</span></p>

        <div class="location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/>
            <circle cx="12" cy="10" r="2.6"/>
          </svg>
          <span>Bengaluru, India</span>
          <span class="location-ru">Бангалор, Индия</span>
        </div>

        <div class="divider"><span></span></div>

        <p class="invite">Be the first to know when our doors open.</p>
        <form id="notify" novalidate>
          <input type="email" id="email" name="email" placeholder="you@example.com" aria-label="Email address" required>
          <button type="submit">Notify Me</button>
        </form>
        <p id="form-msg" class="form-msg" role="status"></p>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
